# SPDX-License-Identifier: Apache-2.0
# gitleaks configuration for the public tree.
#
# Run locally with `gitleaks dir .` (working tree) or `gitleaks git .` (history).
# CI runs it from .github/workflows/repo-hygiene.yml on every push and pull
# request, over the whole repository.
#
# Everything below is an allowlist, and every entry says why. An entry with no
# reason is a way to make the scanner quiet, which is not what it is for.
title = "registry"

[extend]
useDefault = true

[allowlist]
description = "Build output"
paths = [
  # Compiler and package-manager output: crate metadata for PEM parsers and
  # SDKs' own example tokens live here, and none of it is ours.
  '''(^|/)target/''',
  '''(^|/)build/''',
  '''(^|/)bin/''',
  '''(^|/)obj/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.gradle/''',
]

# Public, inert signed-manifest test artifacts generated with a disposable key.
# These are not principal assertions or deployment credentials. Preserve exact bytes:
# only the JWT rule, this file, AND these complete fixture strings are excepted.
# New/changed tokens, tokens elsewhere and all other secret rules still report.
[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "Exact public Registry manifest vectors; no runtime authority"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)contracts/registry-v2/signed-vectors\.json$''']
